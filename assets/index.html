<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexapod Controller</title>
    <link rel="icon" href="/favicons/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/favicons/site.webmanifest">
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #23324a, #0d1320 65%);
            color: #f5f7fb;
        }

        .shell {
            width: min(960px, calc(100vw - 32px));
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            align-items: center;
        }

        .panel {
            background: rgba(12, 16, 28, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        .video-wrap {
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: calc(100vh - 32px);
            overflow: hidden;
        }

        img#stream {
            display: block;
            width: 100%;
            height: auto;
            max-height: calc(100vh - 80px);
            border-radius: 12px;
            background: #000;
            object-fit: contain;
        }

        .side {
            padding: 0px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.3rem;
        }

        .status {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .status strong {
            display: inline-block;
            min-width: 100px;
        }

        .status .status-row+.status-row {
            margin-top: 6px;
        }

        .badge {
            display: inline-block;
            margin-right: 6px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #1d7cf2;
            font-size: 0.75rem;
        }

        @media (max-width: 768px) {
            .shell {
                grid-template-columns: 1fr;
            }
        }

        @media (orientation: portrait) {
            body {
                place-items: start center;
                padding-top: 16px;
            }

            .shell {
                align-items: start;
            }
        }

        @media (orientation: landscape) {
            body {
                place-items: center;
            }

            .shell {
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <section class="panel video-wrap">
            <!-- <iframe id="mtxplayer" src="http://hexapod0.ttyrazor.net:8889/cam/?controls=false" scrolling="no"></iframe> -->
            <img id="stream" src="http://hexapod0.ttyrazor.net:8089/stream.mjpg"></img>
        </section>

        <aside class="panel side">
            <h1>Hexapod Control</h1>
            <div class="status">
                <div class="status-row"><strong>Controller:</strong> <span id="gamepad-status">No gamepad</span></div>
                <div class="status-row"><strong>WebSocket:</strong> <span id="ws-status">+ to start</span></div>
            </div>
        </aside>
    </div>

    <script>
        const streamEl = document.getElementById('stream');
        const gamepadStatusEl = document.getElementById('gamepad-status');
        const axesStatusEl = document.getElementById('axes-status');
        const buttonsStatusEl = document.getElementById('buttons-status');
        const websocketStatusEl = document.getElementById('ws-status');
        const hexapodHost = document.location.hostname;
        const protonServerPort = 8080;
        const websocketUrl = `ws://${hexapodHost}:${protonServerPort}/control/ws`;
        const shutdownUrl = `http://${hexapodHost}:${protonServerPort}/system/shutdown`;
        const logsUrl = `http://${hexapodHost}:${protonServerPort}/logs`;
        
        let shuttingDown = false;

        let hexapodPayload = {
            primary: { x: 0.0, y: 1.0 },
            secondary: { x: 0.0, y: 0.0 },
            primary_x: 'spin',
            primary_y: 'march',
            secondary_x: 'strafe',
            secondary_y: 'none',
            relay_status: false,
            body_height: 0.056,
            body_radius: 0.15,
            step_height: 0.08,
            speed: 0.15,
            position: 1,
            gait: 1,
            voltage: 0.0,
            current: 0.0
        };
        let websocket = null;

        function connectWebSocket() {
            websocketStatusEl.textContent = '🕥';

            try {
                websocket = new WebSocket(websocketUrl);
            } catch (err) {
                console.error('Unable to create WebSocket:', err);
                websocketStatusEl.textContent = '⚠️';
                return;
            }

            websocket.addEventListener('open', () => {
                websocketStatusEl.textContent = '✅';
            });

            websocket.addEventListener('close', () => {
                websocketStatusEl.textContent = '🛑';
            });

            websocket.addEventListener('error', () => {
                websocketStatusEl.textContent = '⚠️';
            });
            websocket.addEventListener('message', (event) => {
                console.log('Received message:', event.data);

                payload = JSON.parse(event.data);

                hexapodPayload.voltage = payload.voltage;
                hexapodPayload.current = payload.current;
                hexapodPayload.position = payload.position;
                hexapodPayload.gait = payload.gait;
                hexapodPayload.body_height = payload.body_height;
                hexapodPayload.body_radius = payload.body_radius;
                hexapodPayload.step_height = payload.step_height;
                hexapodPayload.speed = payload.speed;
                hexapodPayload.relay_status = payload.relay_status;

                console.log('Updated hexapodPayload:', hexapodPayload);
            });
        }

        function updateGamepadUI() {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = pads.find(Boolean);
            let shuttingDown = false;

            if (!pad) {
                gamepadStatusEl.textContent = 'No gamepad';
                axesStatusEl.textContent = '-';
                buttonsStatusEl.textContent = '-';
                return;
            }

            gamepadStatusEl.textContent = pad.id;
            axesStatusEl.textContent = pad.axes.map((value) => value.toFixed(2)).join(', ');
            const buttonLabels = pad.buttons.map((button, index) => {
                return `${index}:${button.pressed ? 1 : 0}`;
            }).join(' ');
            buttonsStatusEl.textContent = buttonLabels;


            if (pad.buttons[9].pressed) {
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        websocket.close();
                    } else {
                        connectWebSocket();
                    }
                } else if (pad.buttons[8].pressed) {
                    // await fetch(websocketHost, {
                    //     method: "POST",
                    //     body: "/system/shutdown",
                    //     headers: {
                    //         "Content-Type": "text/plain"
                    //     });
                }

            if (websocket && websocket.readyState === WebSocket.OPEN) {
                
                    hexapodPayload.primary = { x: pad.axes[0], y: -pad.axes[1] };
                    hexapodPayload.secondary = { x: pad.axes[2], y: pad.axes[3] };
                    hexapodPayload.gait = 
                        pad.buttons[0].pressed ? 1 : (
                        pad.buttons[1].pressed ? 2 : (
                        pad.buttons[2].pressed ? 3 : (
                        pad.buttons[3].pressed ? 4 : hexapodPayload.gait
                    )));
                    hexapodPayload.body_height -= 0.005 * (pad.buttons[4].pressed ? 1 : 0);
                    hexapodPayload.body_height += 0.005 * (pad.buttons[5].pressed ? 1 : 0);
                    hexapodPayload.speed -= 0.001 * (pad.buttons[6].pressed ? 1 : 0); 
                    hexapodPayload.speed += 0.001 * (pad.buttons[7].pressed ? 1 : 0);
                
                websocket.send(JSON.stringify(hexapodPayload));
            }
        }


        window.addEventListener('gamepadconnected', () => {
            updateGamepadUI();
        });

        window.addEventListener('gamepaddisconnected', () => {
            updateGamepadUI();
        });

        function loop() {
            updateGamepadUI();
            requestAnimationFrame(loop);
        }

        // connectWebSocket();
        loop();
    </script>
</body>

</html>
