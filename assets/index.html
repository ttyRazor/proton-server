<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexapod Controller</title>
    <link rel="icon" href="/favicons/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/favicons/site.webmanifest">
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #23324a, #0d1320 65%);
            color: #f5f7fb;
            padding: 16px;
        }

        .shell {
            width: min(1200px, 100%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: stretch;
        }

        .panel {
            background: rgba(12, 16, 28, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        .video-wrap {
            width: 100%;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrap iframe {
            width: 100%;
            height: min(62vh, 720px);
            min-height: 320px;
            border: 0;
            border-radius: 12px;
            background: #000;
            display: block;
        }

        .controls {
            padding: 18px 16px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.3rem;
        }

        .status {
            margin-top: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .status-row {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-block;
            margin-right: 6px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #1d7cf2;
            font-size: 0.75rem;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .power-toggle,
        .shutdown-toggle {
            flex: 1;
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #eef6ff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .power-toggle {
            background: linear-gradient(135deg, #3ddc97, #168a5e);
        }

        .power-toggle.off {
            background: linear-gradient(135deg, #f45d5d, #b22222);
        }

        .shutdown-toggle {
            background: linear-gradient(135deg, #f0ad4e, #a56500);
        }

        .power-toggle:active,
        .shutdown-toggle:active {
            transform: scale(0.99);
        }

        .shutdown-toggle:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .joystick.disabled,
        .vertical-slider:disabled {
            opacity: 0.45;
            filter: grayscale(0.4);
        }

        .joystick.disabled {
            pointer-events: none;
        }

        .vertical-slider {
            width: 120px;
            height: 20px;
            transform: rotate(-90deg);
            accent-color: #1d7cf2;
            cursor: pointer;
        }

        @media (orientation: portrait) {
            body {
                padding: 12px;
            }

            .shell {
                width: min(100%, 700px);
            }

            .video-wrap {
                order: 1;
            }

            .controls {
                order: 2;
            }

            .video-wrap iframe {
                height: 52vh;
                min-height: 260px;
                max-height: 62vh;
            }
        }

        @media (orientation: landscape) and (min-width: 760px) {
            .shell {
                flex-direction: row;
                align-items: center;
            }

            .video-wrap {
                flex: 1 1 auto;
                min-width: 0;
            }

            .video-wrap iframe {
                height: min(74vh, 820px);
                min-height: 360px;
                max-height: 80vh;
            }

            .controls {
                width: min(320px, 32vw);
                align-self: stretch;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <section class="panel video-wrap">
            <iframe id="mtxplayer" src="http://localhost:8889/cam/?controls=false" scrolling="no"></iframe>
        </section>

        <aside class="panel controls">
            <h1>Gamepad Template</h1>
            <div class="badge">LIVE</div>
            <span>Video stream + gamepad input</span>

            <div class="button-row">
                <button id="power-toggle" class="power-toggle off" type="button">Power: OFF</button>
                <button id="shutdown-toggle" class="shutdown-toggle" type="button">Shutdown</button>
            </div>

            <div class="status">
                <div class="status-row" id="gamepad-status">Gamepad: No gamepad</div>
                <div class="status-row" id="ws-status">WS: Connecting…</div>
            </div>

            <div class="joystick-panel">
                <div class="joystick" data-stick="primary">
                    <div class="stick-knob"></div>
                </div>
                <div class="joystick" data-stick="secondary">
                    <div class="stick-knob"></div>
                </div>
            </div>

            <div class="slider-panel">
                <div class="slider-column">
                    <div class="slider-label">Height</div>
                    <div class="vertical-slider-wrap">
                        <input id="height-slider" class="vertical-slider" type="range" min="0.02" max="0.12" step="0.005" value="0.056">
                    </div>
                    <div class="slider-value" id="height-value">0.056</div>
                </div>

                <div class="slider-column">
                    <div class="slider-label">Radius</div>
                    <div class="vertical-slider-wrap">
                        <input id="radius-slider" class="vertical-slider" type="range" min="0.08" max="0.25" step="0.01" value="0.15">
                    </div>
                    <div class="slider-value" id="radius-value">0.15</div>
                </div>

                <div class="slider-column">
                    <div class="slider-label">Speed</div>
                    <div class="vertical-slider-wrap">
                        <input id="speed-slider" class="vertical-slider" type="range" min="0.05" max="0.40" step="0.01" value="0.15">
                    </div>
                    <div class="slider-value" id="speed-value">0.15</div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const streamEl = document.getElementById('mtxplayer');
        const webHost = window.location.hostname;
        const powerToggle = document.getElementById('power-toggle');
        const shutdownToggle = document.getElementById('shutdown-toggle');
        const gamepadStatusEl = document.getElementById('gamepad-status');
        const websocketStatusEl = document.getElementById('ws-status');
        const websocketUrl = `ws://${webHost}:8080/control/ws`;
        const streamUrl = `http://${webHost}:8889/cam/?controls=false`;

        const heightSlider = document.getElementById('height-slider');
        const radiusSlider = document.getElementById('radius-slider');
        const speedSlider = document.getElementById('speed-slider');
        const heightValue = document.getElementById('height-value');
        const radiusValue = document.getElementById('radius-value');
        const speedValue = document.getElementById('speed-value');

        let shutdownRequested = false;
        let shuttingDown = false;
        const virtualStickState = {
            primary: { x: 0, y: 0 },
            secondary: { x: 0, y: 0 }
        };

        let hexapodPayload = {
            primary: { x: 0.0, y: 1.0 },
            secondary: { x: 0.0, y: 0.0 },
            primary_x: 'spin',
            primary_y: 'march',
            secondary_x: 'strafe',
            secondary_y: 'none',
            relay_status: false,
            body_height: 0.056,
            body_radius: 0.15,
            step_height: 0.08,
            speed: 0.15,
            position: 1,
            gait: 1,
            voltage: 0.0,
            current: 0.0
        };
        let websocket = null;

        function syncPowerUI() {
            const isOn = !!hexapodPayload.relay_status;
            powerToggle.textContent = isOn ? 'Power: ON' : 'Power: OFF';
            powerToggle.classList.toggle('off', !isOn);
            shutdownToggle.disabled = !isOn || shutdownRequested;
            const controlsDisabled = !isOn || shutdownRequested;

            document.querySelectorAll('.joystick').forEach((el) => {
                el.classList.toggle('disabled', controlsDisabled);
                el.style.pointerEvents = controlsDisabled ? 'none' : '';
            });

            document.querySelectorAll('.vertical-slider').forEach((el) => {
                el.disabled = controlsDisabled;
            });
        }

        function zeroMotionState() {
            hexapodPayload.primary = { x: 0, y: 0 };
            hexapodPayload.secondary = { x: 0, y: 0 };
            virtualStickState.primary = { x: 0, y: 0 };
            virtualStickState.secondary = { x: 0, y: 0 };
            resetJoysticks();
        }

        function updateSliderDisplay() {
            heightValue.textContent = Number(heightSlider.value).toFixed(3);
            radiusValue.textContent = Number(radiusSlider.value).toFixed(2);
            speedValue.textContent = Number(speedSlider.value).toFixed(2);

            hexapodPayload.body_height = Number(heightSlider.value);
            hexapodPayload.body_radius = Number(radiusSlider.value);
            hexapodPayload.speed = Number(speedSlider.value);
        }

        heightSlider.addEventListener('input', updateSliderDisplay);
        radiusSlider.addEventListener('input', updateSliderDisplay);
        speedSlider.addEventListener('input', updateSliderDisplay);

        powerToggle.addEventListener('click', () => {
            const next = !hexapodPayload.relay_status;
            shutdownRequested = false;
            hexapodPayload.relay_status = next;

            if (!next) {
                zeroMotionState();
            }

            syncPowerUI();

            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify(hexapodPayload));
            }
        });

        shutdownToggle.addEventListener('click', () => {
            shutdownRequested = true;
            hexapodPayload.relay_status = false;
            zeroMotionState();
            syncPowerUI();

            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify(hexapodPayload));
            }
        });

        function setJoystickState(stickName, x, y) {
            const knob = document.querySelector(`[data-stick="${stickName}"] .stick-knob`);
            if (!knob) return;

            const radius = 32;
            const clampedX = Math.max(-1, Math.min(1, x || 0)) * radius;
            const clampedY = Math.max(-1, Math.min(1, y || 0)) * radius;

            knob.style.transform = `translate(-50%, -50%) translate(${clampedX}px, ${clampedY}px)`;
        }

        function resetJoysticks() {
            setJoystickState('primary', 0, 0);
            setJoystickState('secondary', 0, 0);
        }

        function bindJoystick(stickName) {
            const stickEl = document.querySelector(`[data-stick="${stickName}"]`);
            if (!stickEl) return;

            let activePointerId = null;

            const updateFromPointer = (clientX, clientY) => {
                if (!hexapodPayload.relay_status || shutdownRequested) return;

                const rect = stickEl.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = clientX - cx;
                const dy = clientY - cy;
                const maxRadius = rect.width * 0.42;

                let x = dx / maxRadius;
                let y = dy / maxRadius;

                const length = Math.hypot(x, y);
                if (length > 1) {
                    x /= length;
                    y /= length;
                }

                virtualStickState[stickName] = {
                    x: Math.max(-1, Math.min(1, x)),
                    y: Math.max(-1, Math.min(1, y))
                };

                setJoystickState(stickName, virtualStickState[stickName].x, -virtualStickState[stickName].y);
            };

            stickEl.addEventListener('pointerdown', (event) => {
                if (!hexapodPayload.relay_status || shutdownRequested) return;
                activePointerId = event.pointerId;
                stickEl.setPointerCapture(event.pointerId);
                updateFromPointer(event.clientX, event.clientY);
            });

            stickEl.addEventListener('pointermove', (event) => {
                if (!hexapodPayload.relay_status || shutdownRequested) return;
                if (activePointerId !== null && event.pointerId === activePointerId) {
                    updateFromPointer(event.clientX, event.clientY);
                }
            });

            const endPointer = (event) => {
                if (event.pointerId === activePointerId) {
                    activePointerId = null;
                    virtualStickState[stickName] = { x: 0, y: 0 };
                    setJoystickState(stickName, 0, 0);
                }
            };

            stickEl.addEventListener('pointerup', endPointer);
            stickEl.addEventListener('pointercancel', endPointer);
            stickEl.addEventListener('pointerleave', endPointer);
        }

        function connectStream() {
            streamEl.src = streamUrl;
        }

        function connectWebSocket() {
            websocketStatusEl.textContent = 'WS: Connecting…';

            try {
                websocket = new WebSocket(websocketUrl);
            } catch (err) {
                console.error('Unable to create WebSocket:', err);
                websocketStatusEl.textContent = 'WS: Error';
                return;
            }

            websocket.addEventListener('open', () => {
                websocketStatusEl.textContent = 'WS: Connected';
                websocket.send(JSON.stringify(hexapodPayload));
            });

            websocket.addEventListener('close', () => {
                websocketStatusEl.textContent = 'WS: Disconnected';
            });

            websocket.addEventListener('error', () => {
                websocketStatusEl.textContent = 'WS: Error';
            });

            websocket.addEventListener('message', (event) => {
                try {
                    const payload = JSON.parse(event.data);

                    if (typeof payload.relay_status === 'boolean') {
                        hexapodPayload.relay_status = payload.relay_status;

                        if (!payload.relay_status) {
                            shutdownRequested = false;
                        }
                    }

                    hexapodPayload.voltage = payload.voltage ?? hexapodPayload.voltage;
                    hexapodPayload.current = payload.current ?? hexapodPayload.current;
                    hexapodPayload.position = payload.position ?? hexapodPayload.position;
                    hexapodPayload.gait = payload.gait ?? hexapodPayload.gait;
                    hexapodPayload.body_height = payload.body_height ?? hexapodPayload.body_height;
                    hexapodPayload.body_radius = payload.body_radius ?? hexapodPayload.body_radius;
                    hexapodPayload.step_height = payload.step_height ?? hexapodPayload.step_height;
                    hexapodPayload.speed = payload.speed ?? hexapodPayload.speed;

                    syncPowerUI();
                } catch (err) {
                    console.error('Invalid WebSocket payload:', err, event.data);
                }
            });
        }

        function updateGamepadUI() {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = pads.find(Boolean);

            if (!pad) {
                gamepadStatusEl.textContent = 'Gamepad: No gamepad';
                if (!hexapodPayload.relay_status || shutdownRequested) {
                    return;
                }
            } else {
                gamepadStatusEl.textContent = `Gamepad: ${pad.id}`;
            }

            if (!hexapodPayload.relay_status || shutdownRequested) {
                return;
            }

            const axes = Array.from(pad ? pad.axes || [] : []);
            const buttons = Array.from(pad ? pad.buttons || [] : []);

            setJoystickState('primary', axes[0] ?? 0, -(axes[1] ?? 0));
            setJoystickState('secondary', axes[2] ?? 0, -(axes[3] ?? 0));

            if (websocket && websocket.readyState === WebSocket.OPEN) {
                if (buttons[9]?.pressed) {
                    hexapodPayload.relay_status = true;
                    shuttingDown = false;
                } else if (buttons[8]?.pressed) {
                    hexapodPayload.relay_status = false;
                    zeroMotionState();
                    shuttingDown = true;
                }

                if (!shuttingDown) {
                    hexapodPayload.primary = { x: axes[0] ?? 0, y: -(axes[1] ?? 0) };
                    hexapodPayload.secondary = { x: axes[2] ?? 0, y: -(axes[3] ?? 0) };

                    hexapodPayload.gait =
                        buttons[0]?.pressed ? 1 : (
                        buttons[1]?.pressed ? 2 : (
                        buttons[2]?.pressed ? 3 : (
                        buttons[3]?.pressed ? 4 : hexapodPayload.gait
                    )));

                    hexapodPayload.body_height -= 0.005 * (buttons[4]?.pressed ? 1 : 0);
                    hexapodPayload.body_height += 0.005 * (buttons[5]?.pressed ? 1 : 0);
                    hexapodPayload.speed -= 0.001 * (buttons[6]?.pressed ? 1 : 0);
                    hexapodPayload.speed += 0.001 * (buttons[7]?.pressed ? 1 : 0);
                }

                websocket.send(JSON.stringify(hexapodPayload));
            }
        }

        window.addEventListener('gamepadconnected', updateGamepadUI);
        window.addEventListener('gamepaddisconnected', updateGamepadUI);

        function loop() {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = pads.find(Boolean);

            if (!pad && websocket && websocket.readyState === WebSocket.OPEN && hexapodPayload.relay_status && !shutdownRequested) {
                hexapodPayload.primary = { x: virtualStickState.primary.x, y: virtualStickState.primary.y };
                hexapodPayload.secondary = { x: virtualStickState.secondary.x, y: virtualStickState.secondary.y };
                websocket.send(JSON.stringify(hexapodPayload));
            }

            updateGamepadUI();
            requestAnimationFrame(loop);
        }

        bindJoystick('primary');
        bindJoystick('secondary');
        updateSliderDisplay();
        syncPowerUI();
        resetJoysticks();
        connectWebSocket();
        connectStream();
        loop();
    </script>
</body>

</html>
