<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexapod Controller</title>
    <link rel="icon" href="/favicons/favicon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/favicons/site.webmanifest">
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, Helvetica, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #23324a, #0d1320 65%);
            color: #f5f7fb;
            padding: 16px;
        }

        .shell {
            width: min(1200px, 100%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: stretch;
        }

        .panel {
            background: rgba(12, 16, 28, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        .video-wrap {
            width: 100%;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrap iframe {
            width: 100%;
            height: min(62vh, 720px);
            min-height: 320px;
            border: 0;
            border-radius: 12px;
            background: #000;
            display: block;
        }

        .controls {
            padding: 18px 16px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.3rem;
        }

        .status {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .status strong {
            display: inline-block;
            min-width: 100px;
        }

        .status .status-row + .status-row {
            margin-top: 6px;
        }

        .badge {
            display: inline-block;
            margin-right: 6px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #1d7cf2;
            font-size: 0.75rem;
        }

        .joystick-panel {
            display: grid;
            grid-template-columns: repeat(2, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .joystick {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.04);
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .joystick::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .joystick::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 56%, rgba(255,255,255,0.05) 57%, transparent 58%);
        }

        .joystick .stick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7cc3ff, #1d7cf2);
            box-shadow: 0 0 16px rgba(29, 124, 242, 0.6);
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
            pointer-events: none;
        }

        @media (orientation: portrait) {
            body {
                padding: 12px;
            }

            .shell {
                width: min(100%, 700px);
            }

            .video-wrap {
                order: 1;
            }

            .controls {
                order: 2;
            }

            .video-wrap iframe {
                height: 52vh;
                min-height: 260px;
                max-height: 62vh;
            }
        }

        @media (orientation: landscape) and (min-width: 760px) {
            .shell {
                flex-direction: row;
                align-items: center;
            }

            .video-wrap {
                flex: 1 1 auto;
                min-width: 0;
            }

            .video-wrap iframe {
                height: min(74vh, 820px);
                min-height: 360px;
                max-height: 80vh;
            }

            .controls {
                width: min(320px, 32vw);
                align-self: stretch;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <section class="panel video-wrap">
            <iframe id="mtxplayer" src="http://localhost:8889/cam/?controls=false" scrolling="no"></iframe>
        </section>

        <aside class="panel controls">
            <h1>Gamepad Template</h1>
            <div class="badge">LIVE</div>
            <span>Video stream + gamepad input</span>

            <div class="status">
                <div class="status-row"><strong>Connected:</strong> <span id="gamepad-status">No gamepad</span></div>
                <div class="status-row"><strong>Axes:</strong> <span id="axes-status">-</span></div>
                <div class="status-row"><strong>Buttons:</strong> <span id="buttons-status">-</span></div>
                <div class="status-row"><strong>WebSocket:</strong> <span id="ws-status">Connecting…</span></div>
            </div>

            <div class="joystick-panel">
                <div class="joystick" data-stick="primary">
                    <div class="stick-knob"></div>
                </div>
                <div class="joystick" data-stick="secondary">
                    <div class="stick-knob"></div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const streamEl = document.getElementById('mtxplayer');
        const webHost = window.location.hostname;
        const gamepadStatusEl = document.getElementById('gamepad-status');
        const axesStatusEl = document.getElementById('axes-status');
        const buttonsStatusEl = document.getElementById('buttons-status');
        const websocketStatusEl = document.getElementById('ws-status');
        const websocketUrl = `ws://${webHost}:8080/control/ws`;
        const streamUrl = `http://${webHost}:8889/cam/?controls=false`;

        let shuttingDown = false;
        const virtualStickState = {
            primary: { x: 0, y: 0 },
            secondary: { x: 0, y: 0 }
        };

        let hexapodPayload = {
            primary: { x: 0.0, y: 1.0 },
            secondary: { x: 0.0, y: 0.0 },
            primary_x: 'spin',
            primary_y: 'march',
            secondary_x: 'strafe',
            secondary_y: 'none',
            relay_status: false,
            body_height: 0.056,
            body_radius: 0.15,
            step_height: 0.08,
            speed: 0.15,
            position: 1,
            gait: 1,
            voltage: 0.0,
            current: 0.0
        };
        let websocket = null;

        function setJoystickState(stickName, x, y) {
            const knob = document.querySelector(`[data-stick="${stickName}"] .stick-knob`);
            if (!knob) return;

            const radius = 32;
            const clampedX = Math.max(-1, Math.min(1, x || 0)) * radius;
            const clampedY = Math.max(-1, Math.min(1, y || 0)) * radius;

            knob.style.transform = `translate(-50%, -50%) translate(${clampedX}px, ${clampedY}px)`;
        }

        function resetJoysticks() {
            setJoystickState('primary', 0, 0);
            setJoystickState('secondary', 0, 0);
            virtualStickState.primary = { x: 0, y: 0 };
            virtualStickState.secondary = { x: 0, y: 0 };
        }

        function updateStickFromPad() {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = pads.find(Boolean);

            if (!pad) return;

            const axes = Array.from(pad.axes || []);

            setJoystickState('primary', axes[0] ?? 0, -(axes[1] ?? 0));
            setJoystickState('secondary', axes[2] ?? 0, -(axes[3] ?? 0));
        }

        function bindJoystick(stickName) {
            const stickEl = document.querySelector(`[data-stick="${stickName}"]`);
            if (!stickEl) return;

            let activePointerId = null;

            const updateFromPointer = (clientX, clientY) => {
                const rect = stickEl.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = clientX - cx;
                const dy = clientY - cy;
                const maxRadius = rect.width * 0.42;

                let x = dx / maxRadius;
                let y = dy / maxRadius;

                const length = Math.hypot(x, y);
                if (length > 1) {
                    x /= length;
                    y /= length;
                }

                virtualStickState[stickName] = {
                    x: Math.max(-1, Math.min(1, x)),
                    y: Math.max(-1, Math.min(1, y))
                };

                setJoystickState(stickName, virtualStickState[stickName].x, -virtualStickState[stickName].y);
            };

            stickEl.addEventListener('pointerdown', (event) => {
                activePointerId = event.pointerId;
                stickEl.setPointerCapture(event.pointerId);
                updateFromPointer(event.clientX, event.clientY);
            });

            stickEl.addEventListener('pointermove', (event) => {
                if (activePointerId !== null && event.pointerId === activePointerId) {
                    updateFromPointer(event.clientX, event.clientY);
                }
            });

            const endPointer = (event) => {
                if (event.pointerId === activePointerId) {
                    activePointerId = null;
                    virtualStickState[stickName] = { x: 0, y: 0 };
                    setJoystickState(stickName, 0, 0);
                }
            };

            stickEl.addEventListener('pointerup', endPointer);
            stickEl.addEventListener('pointercancel', endPointer);
            stickEl.addEventListener('pointerleave', endPointer);
        }

        function connectStream() {
            streamEl.src = streamUrl;
        }

        function connectWebSocket() {
            websocketStatusEl.textContent = 'Connecting…';

            try {
                websocket = new WebSocket(websocketUrl);
            } catch (err) {
                console.error('Unable to create WebSocket:', err);
                websocketStatusEl.textContent = 'Error';
                return;
            }

            websocket.addEventListener('open', () => {
                websocketStatusEl.textContent = 'Connected';
            });

            websocket.addEventListener('close', () => {
                websocketStatusEl.textContent = 'Disconnected';
            });

            websocket.addEventListener('error', () => {
                websocketStatusEl.textContent = 'Error';
            });

            websocket.addEventListener('message', (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    websocketStatusEl.textContent = JSON.stringify(payload, null, 2);

                    hexapodPayload.voltage = payload.voltage ?? hexapodPayload.voltage;
                    hexapodPayload.current = payload.current ?? hexapodPayload.current;
                    hexapodPayload.position = payload.position ?? hexapodPayload.position;
                    hexapodPayload.gait = payload.gait ?? hexapodPayload.gait;
                    hexapodPayload.body_height = payload.body_height ?? hexapodPayload.body_height;
                    hexapodPayload.body_radius = payload.body_radius ?? hexapodPayload.body_radius;
                    hexapodPayload.step_height = payload.step_height ?? hexapodPayload.step_height;
                    hexapodPayload.speed = payload.speed ?? hexapodPayload.speed;
                    hexapodPayload.relay_status = !!payload.relay_status;
                } catch (err) {
                    console.error('Invalid WebSocket payload:', err, event.data);
                }
            });
        }

        function updateGamepadUI() {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = pads.find(Boolean);

            if (!pad) {
                gamepadStatusEl.textContent = 'No gamepad';
                axesStatusEl.textContent = '-';
                buttonsStatusEl.textContent = '-';

                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    hexapodPayload.primary = {
                        x: virtualStickState.primary.x,
                        y: virtualStickState.primary.y
                    };
                    hexapodPayload.secondary = {
                        x: virtualStickState.secondary.x,
                        y: virtualStickState.secondary.y
                    };
                    websocket.send(JSON.stringify(hexapodPayload));
                }

                return;
            }

            const axes = Array.from(pad.axes || []);
            const buttons = Array.from(pad.buttons || []);

            gamepadStatusEl.textContent = pad.id;
            axesStatusEl.textContent = axes.map((value) => value.toFixed(2)).join(', ');
            buttonsStatusEl.textContent = buttons.map((button, index) => `${index}:${button.pressed ? 1 : 0}`).join(' ');

            setJoystickState('primary', axes[0] ?? 0, -(axes[1] ?? 0));
            setJoystickState('secondary', axes[2] ?? 0, -(axes[3] ?? 0));

            if (websocket && websocket.readyState === WebSocket.OPEN) {
                if (buttons[9]?.pressed) {
                    hexapodPayload.relay_status = true;
                    shuttingDown = false;
                } else if (buttons[8]?.pressed) {
                    hexapodPayload.relay_status = false;
                    hexapodPayload.primary = { x: 0.0, y: 0.0 };
                    hexapodPayload.secondary = { x: 0.0, y: 0.0 };
                    shuttingDown = true;
                }

                if (!shuttingDown) {
                    hexapodPayload.primary = { x: axes[0] ?? 0, y: -(axes[1] ?? 0) };
                    hexapodPayload.secondary = { x: axes[2] ?? 0, y: -(axes[3] ?? 0) };

                    hexapodPayload.gait =
                        buttons[0]?.pressed ? 1 : (
                        buttons[1]?.pressed ? 2 : (
                        buttons[2]?.pressed ? 3 : (
                        buttons[3]?.pressed ? 4 : hexapodPayload.gait
                    )));

                    hexapodPayload.body_height -= 0.005 * (buttons[4]?.pressed ? 1 : 0);
                    hexapodPayload.body_height += 0.005 * (buttons[5]?.pressed ? 1 : 0);
                    hexapodPayload.speed -= 0.001 * (buttons[6]?.pressed ? 1 : 0);
                    hexapodPayload.speed += 0.001 * (buttons[7]?.pressed ? 1 : 0);
                }

                websocket.send(JSON.stringify(hexapodPayload));
            }
        }

        window.addEventListener('gamepadconnected', updateGamepadUI);
        window.addEventListener('gamepaddisconnected', updateGamepadUI);

        function loop() {
            const pads = navigator.getGamepads ? navigator.getGamepads() : [];
            const pad = pads.find(Boolean);

            if (!pad && websocket && websocket.readyState === WebSocket.OPEN) {
                hexapodPayload.primary = {
                    x: virtualStickState.primary.x,
                    y: virtualStickState.primary.y
                };
                hexapodPayload.secondary = {
                    x: virtualStickState.secondary.x,
                    y: virtualStickState.secondary.y
                };
                websocket.send(JSON.stringify(hexapodPayload));
            }

            updateGamepadUI();
            requestAnimationFrame(loop);
        }

        bindJoystick('primary');
        bindJoystick('secondary');
        resetJoysticks();
        connectWebSocket();
        connectStream();
        loop();
    </script>
</body>

</html>
